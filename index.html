<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>Family Wall Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <section id="screen-planner" class="screen"></section>
    <section id="screen-morning" class="screen kid"></section>
    <section id="screen-menu" class="screen"></section>
    <section id="screen-bedtime" class="screen kid"></section>
    <section id="screen-sleep" class="screen"></section>
  </div>

  <div id="overlay-root"></div>
  <div id="curtain"><div class="curtain-in"><span id="curtain-icon"></span><span id="curtain-text"></span></div></div>
  <div id="confetti"></div>
  <nav id="preview-bar"></nav>
  <div id="rotate-hint"><div>Turn your screen sideways.<small>This board is built for a wide screen: a tablet on its side or a laptop.</small></div></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
